# ===== 应用基础配置 =====
spring:
  # 把工程根目录的 .env 当 properties 载入（无扩展名，必须用 [.properties] 指定格式）
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: marketserver

  # ===== 数据源（MySQL）=====
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lzmall}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===== Redis =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

server:
  port: ${SERVER_PORT:8080}

# ===== MyBatis-Plus =====
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.lzsp
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# ===== JWT（由 lz_security 模块读取）=====
lz:
  jwt:
    secret: ${JWT_SECRET:lzmall-dev-secret-key-change-me-0123456789}
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}
