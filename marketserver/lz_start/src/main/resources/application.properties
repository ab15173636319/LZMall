# ===== 应用基础配置 =====
spring.application.name=marketserver
server.port=${SERVER_PORT:8080}

# ===== 数据源（MySQL）=====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lzmall}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DB:0}

# ===== MyBatis-Plus =====
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.lzsp
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto

# ===== JWT（由 lz_security 模块读取）=====
lz.jwt.secret=${JWT_SECRET:lzmall-dev-secret-key-change-me-0123456789}
lz.jwt.expire-minutes=${JWT_EXPIRE_MINUTES:120}
